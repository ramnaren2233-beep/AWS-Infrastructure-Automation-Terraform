name: Terraform CI/CD Automation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Format, Validate and Plan
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: 3. Terraform Format
        run: terraform fmt -check -recursive

      - name: 4. Terraform Init
        run: terraform init

      - name: 5. Terraform Validate
        run: terraform validate

      - name: 6. Terraform Plan
        run: terraform plan -out=tfplan

      - name: 7. Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan
          retention-days: 5

  terraform-apply:
    name: Manual Approval and Apply
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: terraform-production

    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: 3. Terraform Init
        run: terraform init

      - name: 4. Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan

      - name: 5. Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: 6. Terraform Outputs
        run: terraform output
